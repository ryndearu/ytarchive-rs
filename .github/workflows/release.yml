name: Release

# Manual releases: push a tag like v0.1.0 to build every platform and publish
# a normal (non-pre) GitHub release with generated notes. The assets are
# plain executables (ytarchive_<os>_<arch>[.exe]).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Run JavaScript actions on the newest Node GitHub's runners provide.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      channel: release
      version: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
