name: Release

# A pushed v* tag builds every platform and publishes the release, with a
# changelog since the previous v* tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write release notes
        shell: bash
        run: |
          {
            dl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
            echo "## Downloads"
            echo
            echo "One zip per platform, holding only the executable. Linux builds are static and run on any distribution. Checksums are in \`SHA256SUMS\`."
            echo
            echo "| Platform | x64 | arm64 |"
            echo "| --- | --- | --- |"
            echo "| Windows | [\`ytarchive_windows_x64.zip\`]($dl/ytarchive_windows_x64.zip) | [\`ytarchive_windows_arm64.zip\`]($dl/ytarchive_windows_arm64.zip) |"
            echo "| Linux | [\`ytarchive_linux_x64.zip\`]($dl/ytarchive_linux_x64.zip) | [\`ytarchive_linux_arm64.zip\`]($dl/ytarchive_linux_arm64.zip) |"
            echo "| macOS | [\`ytarchive_macos_x64.zip\`]($dl/ytarchive_macos_x64.zip) (Intel) | [\`ytarchive_macos_arm64.zip\`]($dl/ytarchive_macos_arm64.zip) (Apple Silicon) |"
            echo
            bash .github/changelog.sh "$SHA" "$TAG" "$TAG"
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        shell: bash
        run: (cd dist && sha256sum *.zip > SHA256SUMS)

      - name: Publish
        run: gh release create "$TAG" dist/* --verify-tag --latest --title "$TAG" --notes-file notes.md
