name: CI

# Only changes under src/ run CI.
on:
  push:
    branches: [main]
    paths: ["src/**"]
  pull_request:
    paths: ["src/**"]

env:
  CARGO_TERM_COLOR: always
  # Run JavaScript actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: cargo run --quiet -- --version
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # Network tests are #[ignore]d and don't run here.
        run: cargo test
