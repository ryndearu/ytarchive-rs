name: CI

# Only changes to the code or to what builds and checks it run CI.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Run JavaScript actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (version and components from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: cargo run --quiet --locked -- --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        # Network tests are #[ignore]d and don't run here.
        run: cargo test --locked

  # The test job runs on Windows x64, Linux x64, and macOS arm64. This checks
  # that the other three release targets still compile, set up as in build.yml.
  check:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # aarch64 Linux needs a C cross compiler (ring, SQLite): cross has one.
      CROSS: ${{ matrix.target == 'aarch64-unknown-linux-musl' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.target }}
      # A prebuilt binary; building cross from source takes minutes.
      - name: Install cross
        if: env.CROSS == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Check
        shell: bash
        run: |
          if [ "$CROSS" = "true" ]; then
            cross check --all-targets --locked --target ${{ matrix.target }}
          else
            cargo check --all-targets --locked --target ${{ matrix.target }}
          fi

  # Keeps `rust-version` in Cargo.toml true: the crate must build with it.
  minimum-rust:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version named in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "$version" --profile minimal
          echo "MINIMUM_RUST=$version" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo "+$MINIMUM_RUST" check --locked
