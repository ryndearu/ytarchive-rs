name: Audit

# Checks the dependencies in Cargo.lock with cargo-deny (deny.toml): weekly (new
# advisories appear without any change here), and whenever the dependencies
# change.
on:
  schedule:
    - cron: "23 17 * * 5" # Saturday 00:23 GMT+7
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary; building from source takes minutes.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # A vulnerable dependency, a license not in deny.toml, or a source other
      # than crates.io fails.
      - name: Deny
        run: cargo deny --locked check -W unmaintained -W unsound
