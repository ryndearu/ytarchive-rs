name: Build

# Reusable: builds every platform and uploads one zip per platform
# (ytarchive_<os>_<arch>.zip, containing only ytarchive or ytarchive.exe) as
# workflow artifacts named "dist-<target>". Releases build x64 and arm64 for
# each OS; nightly builds only Windows x64, Linux x64, and macOS arm64. Used by
# release.yml and nightly.yml.
on:
  workflow_call:
    inputs:
      channel:
        description: "release (version from the tag) or nightly (version+commit)"
        required: true
        type: string
      version:
        description: Version tag for release builds (e.g. v0.1.0)
        required: false
        type: string
        default: ""
      ref:
        description: Commit to build
        required: false
        type: string
        default: ""
      all_targets:
        description: Build every target (false = Windows x64, Linux x64, macOS arm64 only)
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # Run JavaScript actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux builds are static musl and run on any distribution.
        target: ${{ fromJSON(inputs.all_targets && '["x86_64-pc-windows-msvc","aarch64-pc-windows-msvc","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","aarch64-apple-darwin","x86_64-apple-darwin"]' || '["x86_64-pc-windows-msvc","x86_64-unknown-linux-musl","aarch64-apple-darwin"]') }}
    runs-on: ${{ contains(matrix.target, 'windows') && 'windows-latest' || contains(matrix.target, 'apple') && 'macos-latest' || 'ubuntu-latest' }}
    env:
      # aarch64 Linux is built in a cross container; the rest natively.
      CROSS: ${{ matrix.target == 'aarch64-unknown-linux-musl' }}
      # Targets the runner can execute, to print --version.
      RUNNABLE: ${{ contains(fromJSON('["x86_64-pc-windows-msvc","x86_64-unknown-linux-musl","aarch64-apple-darwin"]'), matrix.target) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Cache Rust and C dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-on-failure: true

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # A prebuilt binary; building cross from source takes minutes.
      - name: Install cross
        if: env.CROSS == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Version stamp
        shell: bash
        run: |
          {
            echo "YTARCHIVE_CHANNEL=${{ inputs.channel }}"
            echo "YTARCHIVE_VERSION=${{ inputs.version }}"
            echo "YTARCHIVE_COMMIT=$(git rev-parse --short=7 HEAD)"
            echo "YTARCHIVE_DATE=$(git log -1 --format=%cs)"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          if [ "$CROSS" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Version
        if: env.RUNNABLE == 'true'
        shell: bash
        run: target/${{ matrix.target }}/release/ytarchive --version

      - name: Zip
        shell: bash
        run: |
          target=${{ matrix.target }}
          case "$target" in
            *windows*) os=windows ;;
            *linux*) os=linux ;;
            *apple*) os=macos ;;
          esac
          case "$target" in
            x86_64-*) arch=x64 ;;
            aarch64-*) arch=arm64 ;;
          esac
          zipfile="$GITHUB_WORKSPACE/dist/ytarchive_${os}_${arch}.zip"
          mkdir -p dist
          cd "target/$target/release"
          if [ "$os" = windows ]; then
            7z a "$zipfile" ytarchive.exe > /dev/null
          else
            # zip keeps the executable bit.
            zip -q "$zipfile" ytarchive
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 3
