name: Build

# Reusable: a v* tag builds every target as a release; anything else builds a
# nightly of Windows x64 and Linux x64.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux builds are static musl.
        target: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["x86_64-pc-windows-msvc","aarch64-pc-windows-msvc","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","aarch64-apple-darwin","x86_64-apple-darwin"]' || '["x86_64-pc-windows-msvc","x86_64-unknown-linux-musl"]') }}
    # Each target builds on a runner of its OS: arm64 Linux on GitHub's arm64
    # runner; Windows arm64 (on x64) and macOS x64 (on arm64) cross-compile.
    runs-on: ${{ contains(matrix.target, 'windows') && 'windows-latest' || contains(matrix.target, 'apple') && 'macos-latest' || startsWith(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      # Set only for releases; build.rs then leaves the commit out of the version.
      YTARCHIVE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Cache Rust and C dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-on-failure: true

      - name: Install musl tools
        if: contains(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Zip
        shell: bash
        run: |
          target=${{ matrix.target }}
          case $target in *windows*) os=windows ;; *linux*) os=linux ;; *) os=macos ;; esac
          case $target in x86_64-*) arch=x64 ;; *) arch=arm64 ;; esac
          zipfile="$GITHUB_WORKSPACE/dist/ytarchive_${os}_${arch}.zip"
          mkdir -p dist
          cd "target/$target/release"
          if [ "$os" = windows ]; then
            7z a "$zipfile" ytarchive.exe > /dev/null
          else
            # zip keeps the executable bit.
            zip -q "$zipfile" ytarchive
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 3
