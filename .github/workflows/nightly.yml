name: Nightly

# Replaces the nightly pre-release with a build of main and the commits since
# the last v* release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  TAG: nightly

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write release notes
        shell: bash
        run: |
          # Same string build.rs stamps for nightly builds.
          version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)+${SHA:0:7} ($(git log -1 --format=%cs "$SHA"))"
          {
            echo "Automated nightly build of [\`${SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA): \`ytarchive $version\`."
            echo
            bash .github/changelog.sh "$SHA" "$SHA"
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Replace nightly pre-release
        shell: bash
        run: |
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --prerelease \
            --target "$SHA" \
            --title "Nightly $(date -u +%Y-%m-%d) (${SHA:0:7})" \
            --notes-file notes.md
