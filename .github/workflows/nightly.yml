name: Nightly

# Tests and builds main, then updates the nightly pre-release in place with the
# new zips, SHA256SUMS, and the commits since the last v* release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  TAG: nightly

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write release notes
        shell: bash
        run: |
          # Same string build.rs stamps for nightly builds.
          version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)+${SHA:0:7} ($(git log -1 --format=%cs "$SHA"))"
          {
            echo "Automated nightly build of [\`${SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA): \`ytarchive $version\`. Checksums are in \`SHA256SUMS\`."
            echo
            bash .github/changelog.sh "$SHA" "$SHA"
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        shell: bash
        run: (cd dist && sha256sum *.zip > SHA256SUMS)

      - name: Update nightly pre-release
        shell: bash
        run: |
          title="Nightly $(date -u +%Y-%m-%d) (${SHA:0:7})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # Drop leftover assets from older target lists after uploading the new ones.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [ -n "$asset" ] && [ ! -e "dist/$asset" ]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
            git tag -f "$TAG" "$SHA"
            git push origin "refs/tags/$TAG" --force
            gh release edit "$TAG" \
              --prerelease \
              --target "$SHA" \
              --title "$title" \
              --notes-file notes.md
          else
            git tag -f "$TAG" "$SHA"
            git push origin "refs/tags/$TAG" --force
            gh release create "$TAG" dist/* \
              --prerelease \
              --verify-tag \
              --title "$title" \
              --notes-file notes.md
          fi
