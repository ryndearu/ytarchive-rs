[package]
name = "ytarchive"
version = "0.2.0"
edition = "2024"
# The oldest Rust that builds this crate (set by the dependencies).
rust-version = "1.89"
description = "Archive YouTube livestreams from the start (Rust port of dreammu/ytarchive)"
license = "MIT"

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
# rustls with the `ring` provider: no OpenSSL/cmake/nasm needed on Linux,
# Windows, or macOS; certificates come from the OS store.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "cookies",
    "gzip",
    "socks",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "process",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7.20"
url = "2.5.8"

# Safe wrappers for the Windows console/power calls, so the crate needs no
# `unsafe` of its own.
[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3.1"
keepawake = "0.6.1"
winapi-util = "0.1.11"

# The tests' fake servers listen on TCP.
[dev-dependencies]
tokio = { version = "1.54.1", features = ["net"] }

# Code outside tests must not panic or drop errors; tests are exempt through
# clippy.toml.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
