[package]
name = "ytarchive"
version = "0.1.0"
edition = "2024"
description = "Archive YouTube livestreams from the start (Rust port of dreammu/ytarchive)"
license = "MIT"

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["cookies", "gzip", "socks"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
